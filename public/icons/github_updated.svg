<svg
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Clock circle -->
  <circle
    cx="12"
    cy="12"
    r="8"
    stroke="#4F7DFF"
    stroke-width="2.25"
  />

  <!-- Hour hand -->
  <path
    d="M12 8V12"
    stroke="#4F7DFF"
    stroke-width="2.25"
    stroke-linecap="round"
  />

  <!-- Minute hand -->
  <path
    d="M12 12L15 14"
    stroke="#4F7DFF"
    stroke-width="2.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>